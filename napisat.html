<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="assets/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<title>Новая запись в блог · Fohow</title>
<link rel="preload" href="assets/fonts/manrope-normal-cyrillic-9f2868.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/cormorant-garamond-normal-cyrillic-4f4a82.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body class="pisat">

<header class="top">
  <div class="wrap">
    <a class="brand" href="blog.html">
      <img src="assets/logo-fohow.png" alt="Fohow" width="90" height="30">
      <span>Ян Шен<small>новая запись в блог</small></span>
    </a>
    <a class="btn btn-line btn-sm" href="blog.html">Открыть блог</a>
  </div>
</header>

<section class="pisat-main">
  <div class="wrap pisat-grid">
    <form class="pisat-form" id="forma" autocomplete="off" novalidate>
      <div class="eyebrow">Новая запись</div>
      <h1>Написать в блог</h1>

      <div class="fld">
        <span id="kluch-zag">Ключ доступа</span>
        <input type="password" id="kluch" aria-labelledby="kluch-zag" autocomplete="off" spellcheck="false" placeholder="Вставьте ключ из сообщения">
        <small id="kluch-info">Вставьте ключ один раз, телефон его запомнит</small>
        <button type="button" class="link-btn" id="kluch-zabyt" hidden>Забыть ключ на этом устройстве</button>
      </div>

      <label class="fld">
        <span>Заголовок <i>необязательно</i></span>
        <input type="text" id="zag" maxlength="120" placeholder="Например: Мысль дня">
      </label>

      <label class="fld">
        <span>Текст</span>
        <textarea id="tekst" rows="9" maxlength="5000" placeholder="Ваша мысль"></textarea>
        <small>Пустая строка начинает новый абзац. Строка, которая начинается с «- », станет пунктом списка</small>
      </label>

      <div class="fld">
        <span>Фото <i>необязательно</i></span>
        <label class="foto-btn" id="foto-btn">
          <input type="file" id="foto" accept="image/*">
          <b id="foto-name">Выбрать фото</b>
        </label>
        <button type="button" class="link-btn" id="foto-del" hidden>Убрать фото</button>
      </div>

      <div class="proverka" id="proverka" aria-live="polite">
        <div class="pr-ok" id="pr-ok">Напишите текст, и я проверю его перед публикацией</div>
        <div class="pr-red" id="pr-red" hidden></div>
        <div class="pr-yel" id="pr-yel" hidden></div>
      </div>

      <button type="submit" class="btn btn-red btn-wide" id="opublikovat" disabled>Опубликовать</button>
      <p class="otvet" id="otvet" role="status"></p>
    </form>

    <div class="pisat-side">
      <div class="eyebrow">Так запись будет выглядеть на сайте</div>
      <div class="feed feed-preview" id="predprosmotr"></div>

      <div class="moi">
        <div class="eyebrow">Мои записи</div>
        <ul id="spisok"></ul>
      </div>
    </div>
  </div>
</section>

<script id="posts-data" type="application/json">[{"id": "2026-11-16-put", "date": null, "label": "Из моего канала", "title": "Здоровье: путь, а не цель", "text": "Здоровье не результат одного правильного действия, а сумма ежедневных выборов.\n\nЭту идею Fohow несёт через свою миссию: сделать культуру здоровья доступной каждому человеку, независимо от страны и возраста. Не просто продавать продукты, а распространять образ жизни, в котором здоровье становится естественным следствием гармонии.\n\nЗдоровье не цель. Это путь.", "img": null, "alt": null, "credit": null}, {"id": "2026-11-16-printsipy", "date": null, "label": "Из моего канала", "title": "Что нужно человеку: краткий ответ ТКМ", "text": "Если свести всё к простым принципам:\n- Движение без истощения\n- Еда как поддержка, а не как удовольствие или привычка\n- Эмоциональный баланс\n- Следование ритмам природы\n- Постоянство, а не героические усилия", "img": null, "alt": null, "credit": null}, {"id": "2026-11-16-huangshan", "date": null, "label": "Из моего канала", "title": "Горы Хуаншань", "text": "Окутанные облаками горы Хуаншань в провинции Аньхой.\n\nРаньше их называли Ишань, «Иссиня-чёрные горы». Нынешнее имя, Жёлтые горы, они получили в 747 году в честь легендарного Жёлтого императора Хуан-ди. По преданию, именно здесь он создавал эликсир бессмертия.", "img": "assets/huangshan-solnce-900.webp", "alt": "Горы Хуаншань под солнцем, облака и зелёные склоны", "credit": "Фото: xiquinhosilva, лицензия CC BY 2.0"}]</script>
<script id="stop-data" type="application/json">{"red": ["вылеч", "излеч", "лечит", "лечат", "лечени", "лечеб", "лечу", "лечим", "лечил", "лекарств", "исцел", "болезн", "заболе", "недуг", "диагноз", "онколог", "=рак", "раков", "опухол", "диабет", "астм", "инсульт", "инфаркт", "гипертон", "covid", "ковид", "коронавирус", "эпидеми", "пандеми", "гарантир", "панаце", "чудодейств", "избавит", "избавля", "избавил"], "yellow": ["иммунитет", "=боль", "=боли", "=болит", "=болят", "сустав", "давлени", "вирус", "препарат", "симптом", "омолож", "похуд", "сжига", "токсин", "шлак", "100%"]}</script>
<script>
(function(){
  // Публикация без своего сервера: страница сама сохраняет запись в хранилище сайта на GitHub
  // (blog/posts.json + готовая разметка в blog.html + фото в blog/img/) одним сохранением.
  // Хостинг забирает сайт из GitHub и обновляется сам через пару минут.
  // Ключ доступа = личный ключ GitHub только на это хранилище с правом «Contents: Read and write».
  var q = new URLSearchParams(location.search);
  var REPO = 'dubobrik-cpu/fohow', VETKA = q.get('vetka') || 'main';
  var GH = 'https://api.github.com/repos/' + REPO, LS = 'fohow-blog-kluch';
  var posts = JSON.parse(document.getElementById('posts-data').textContent || '[]');
  var stop = JSON.parse(document.getElementById('stop-data').textContent || '{}');
  var $ = function(id){ return document.getElementById(id); };
  var kluch = '', rabota = false, fotoUrl = null, fotoFile = null, idet = false;

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[c]; }); }
  var MES = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  function dataRu(iso){ var m = String(iso).slice(0, 10).split('-'); return (+m[2]) + ' ' + MES[m[1] - 1] + ' ' + m[0]; }
  function dv(n){ return (n < 10 ? '0' : '') + n; }
  function isoSeychas(){
    var d = new Date(), o = -d.getTimezoneOffset();
    return d.getFullYear() + '-' + dv(d.getMonth() + 1) + '-' + dv(d.getDate()) + 'T' + dv(d.getHours()) + ':' + dv(d.getMinutes()) + ':' + dv(d.getSeconds()) +
      (o >= 0 ? '+' : '-') + dv(Math.floor(Math.abs(o) / 60)) + ':' + dv(Math.abs(o) % 60);
  }
  function lsGet(){ try { return localStorage.getItem(LS) || ''; } catch(e){ return ''; } }
  function lsSet(v){ try { if(v) localStorage.setItem(LS, v); else localStorage.removeItem(LS); } catch(e){} }

  // тот же разбор текста, что в сборщике blog-build.py
  function textHtml(t){
    return t.replace(/\r/g,'').split(/\n\s*\n/).map(function(block){
      var out = '', para = [], list = [];
      block.split('\n').forEach(function(line){
        line = line.trim(); if(!line) return;
        if(/^[-•]\s+/.test(line)){
          if(para.length){ out += '<p>' + para.join('<br>') + '</p>'; para = []; }
          list.push('<li>' + esc(line.replace(/^[-•]\s+/, '')) + '</li>');
        } else {
          if(list.length){ out += '<ul>' + list.join('') + '</ul>'; list = []; }
          para.push(esc(line));
        }
      });
      if(para.length) out += '<p>' + para.join('<br>') + '</p>';
      if(list.length) out += '<ul>' + list.join('') + '</ul>';
      return out;
    }).join('');
  }

  // запись в blog.html, один в один с post_html в blog-build.py
  function postHtml(p, w, h){
    var meta = p.date ? dataRu(p.date) : (p.label || '');
    var s = '      <article class="post rise" id="' + esc(p.id) + '">\n' +
            '        <div class="post-meta eyebrow">' + esc(meta) + '</div>\n';
    if(p.title) s += '        <h2>' + esc(p.title) + '</h2>\n';
    s += '        <div class="post-text">' + textHtml(p.text) + '</div>\n';
    if(p.img) s += '        <figure class="post-pic"><img src="' + esc(p.img) + '" alt="' + esc(p.alt || p.title || '') + '" loading="lazy"' +
      (w ? ' width="' + w + '" height="' + h + '"' : '') + '>' + (p.credit ? '<figcaption>' + esc(p.credit) + '</figcaption>' : '') + '</figure>\n';
    return s + '      </article>';
  }

  // порядок как на странице блога: записи с датой новые сверху, стартовые без даты в конце
  function poryadok(ps){
    var s = ps.filter(function(p){ return p.date; }).sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    return s.concat(ps.filter(function(p){ return !p.date; }));
  }

  // поиск слов из списка: начало слова, «=» значит целое слово
  function nayti(text, spisok){
    var low = text.toLowerCase().replace(/ё/g,'е'), found = [];
    (spisok || []).forEach(function(w){
      var whole = w.charAt(0) === '=', stem = (whole ? w.slice(1) : w).replace(/ё/g,'е');
      var re = new RegExp('(^|[^а-яa-z0-9])(' + stem.replace(/[.*+?^${}()|[\]\\%]/g,'\\$&') + (whole ? ')(?![а-яa-z0-9])' : '[а-яa-z0-9]*)'), 'gi');
      var m; while((m = re.exec(low))){ var word = text.substr(m.index + m[1].length, m[2].length); if(found.indexOf(word) < 0) found.push(word); }
    });
    return found;
  }

  function obnovit(){
    var zag = $('zag').value.trim(), t = $('tekst').value.trim();
    var vse = zag + '\n' + t;
    var red = nayti(vse, stop.red), yel = nayti(vse, stop.yellow);
    $('pr-ok').hidden = !!(red.length || yel.length) && !!t;
    $('pr-ok').textContent = t ? 'Проверено: слов про лечение нет' : 'Напишите текст, и я проверю его перед публикацией';
    $('pr-ok').className = t ? 'pr-ok good' : 'pr-ok';
    $('pr-red').hidden = !red.length;
    $('pr-red').innerHTML = '<b>Так писать нельзя:</b> ' + red.map(function(w){ return '<mark class="mr">' + esc(w) + '</mark>'; }).join(' ') + '<br>Для сайта с БАД закон о рекламе запрещает обещать лечение. Перепишите эти места, например «мне помогает чувствовать себя бодрее» вместо «лечит»';
    $('pr-yel').hidden = !yel.length;
    $('pr-yel').innerHTML = '<b>Проверьте:</b> ' + yel.map(function(w){ return '<mark class="my">' + esc(w) + '</mark>'; }).join(' ') + '<br>Опубликовать можно, но убедитесь, что здесь нет обещания результата';
    $('opublikovat').disabled = !t || red.length > 0;

    $('predprosmotr').innerHTML = '<article class="post"><div class="post-meta eyebrow">' + dataRu(isoSeychas()) + '</div>' +
      (zag ? '<h2>' + esc(zag) + '</h2>' : '') +
      '<div class="post-text">' + (t ? textHtml(t) : '<p class="pusto">Здесь появится ваш текст</p>') + '</div>' +
      (fotoUrl ? '<figure class="post-pic"><img src="' + fotoUrl + '" alt=""></figure>' : '') + '</article>';
  }

  function spisok(){
    $('spisok').innerHTML = poryadok(posts).map(function(p){
      return '<li><span>' + esc(p.title || p.text.slice(0, 60)) + '<small>' + (p.date ? dataRu(p.date) : esc(p.label || '')) + '</small></span><button type="button" class="link-btn" data-id="' + esc(p.id) + '">Удалить</button></li>';
    }).join('') || '<li><span>Записей пока нет</span></li>';
  }

  function soobshchit(vid, html){ $('otvet').className = 'otvet ' + vid; $('otvet').innerHTML = html; }
  function kluchInfo(vid, text){ $('kluch-info').className = vid; $('kluch-info').textContent = text; }

  // ---- GitHub ----
  function gh(put, metod, telo){
    return fetch(GH + put, {
      method: metod || 'GET', cache: 'no-store',
      headers: {'Authorization': 'Bearer ' + kluch, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
      body: telo ? JSON.stringify(telo) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if(!r.ok){ var e = new Error(d.message || ('код ' + r.status)); e.status = r.status; throw e; }
        return d;
      });
    }, function(){ var e = new Error('нет связи'); e.status = 0; throw e; });
  }
  function b64tekst(s){
    var bin = atob(String(s).replace(/\s/g, '')), u = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(u);
  }
  function fayl(put, ref){ return gh('/contents/' + put + '?ref=' + ref).then(function(d){ return b64tekst(d.content); }); }
  function blobB64(blob){
    return new Promise(function(ok, no){ var r = new FileReader(); r.onload = function(){ ok(String(r.result).split(',')[1]); }; r.onerror = no; r.readAsDataURL(blob); });
  }
  function ponyatno(e){
    if(e.status === 401) return 'Ключ не подходит или устарел. Напишите Виктории, она пришлёт новый';
    if(e.status === 403 || e.status === 404) return 'У этого ключа нет доступа к сайту. Напишите Виктории';
    if(e.status === 0) return 'Нет связи. Проверьте интернет и нажмите ещё раз';
    if(e.status === 409 || e.status === 422) return 'Сайт как раз обновлялся. Нажмите ещё раз';
    return 'Не получилось (' + esc(e.message) + '). Запись не сохранилась, напишите Виктории';
  }

  // одно сохранение в GitHub: читаем свежие posts.json и blog.html, меняем, сохраняем вместе
  function sohranit(izmenit, opisanie){
    return gh('/git/ref/heads/' + VETKA).then(function(ref){
      var head = ref.object.sha;
      return gh('/git/commits/' + head).then(function(c){
        return Promise.all([fayl('blog/posts.json', head), fayl('blog.html', head)]).then(function(f){
          var res = izmenit(JSON.parse(f[0]), f[1]);
          var tree = [
            {path: 'blog/posts.json', mode: '100644', type: 'blob', content: JSON.stringify(res.posts, null, 2) + '\n'},
            {path: 'blog.html', mode: '100644', type: 'blob', content: res.blog}
          ].concat(res.dop || []);
          return gh('/git/trees', 'POST', {base_tree: c.tree.sha, tree: tree})
            .then(function(t){ return gh('/git/commits', 'POST', {message: opisanie, tree: t.sha, parents: [head]}); })
            .then(function(nc){ return gh('/git/refs/heads/' + VETKA, 'PATCH', {sha: nc.sha, force: false}); })
            .then(function(){ return res.posts; });
        });
      });
    });
  }
  // если сайт обновился между чтением и сохранением, пробуем ещё раз
  function sohranitSPovtorom(izmenit, opisanie){
    return sohranit(izmenit, opisanie).catch(function(e){
      if(e.status === 409 || e.status === 422) return sohranit(izmenit, opisanie);
      throw e;
    });
  }

  function zagruzitBezKlucha(){
    fetch('blog/posts.json', {cache: 'no-store'}).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if(Array.isArray(d)){ posts = d; spisok(); } }).catch(function(){});
    fetch('blog/stop-slova.json', {cache: 'no-store'}).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if(d && d.red){ stop = d; obnovit(); } }).catch(function(){});
  }

  function proverit(){
    kluch = $('kluch').value.trim();
    rabota = false;
    if(!kluch){ kluchInfo('', 'Вставьте ключ один раз, телефон его запомнит'); $('kluch-zabyt').hidden = true; return; }
    kluchInfo('', 'Проверяю ключ…');
    var k = kluch;
    Promise.all([fayl('blog/posts.json', VETKA), fayl('blog/stop-slova.json', VETKA)]).then(function(f){
      if(k !== kluch) return;
      posts = JSON.parse(f[0]); stop = JSON.parse(f[1]);
      rabota = true; lsSet(kluch); $('kluch-zabyt').hidden = false;
      kluchInfo('good', 'Ключ подходит, можно публиковать');
      spisok(); obnovit();
    }).catch(function(e){
      if(k !== kluch) return;
      kluchInfo('err', ponyatno(e));
    });
  }

  // уменьшаем фото в телефоне до 1600 точек по длинной стороне
  function szhat(f){
    return new Promise(function(ok, no){
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function(){
        var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var gotovo = function(b, ext){ b ? ok({blob: b, w: c.width, h: c.height, ext: ext}) : no(new Error('фото не сохранилось')); };
        c.toBlob(function(b){
          if(b && b.type === 'image/webp') gotovo(b, 'webp');
          else c.toBlob(function(j){ gotovo(j, 'jpg'); }, 'image/jpeg', 0.85);
        }, 'image/webp', 0.82);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); no(new Error('Это фото не открылось. Выберите другое, в формате JPG или PNG')); };
      img.src = url;
    });
  }

  function sbrosFoto(){
    if(fotoUrl) URL.revokeObjectURL(fotoUrl); fotoUrl = null; fotoFile = null; $('foto').value = '';
    $('foto-name').textContent = 'Выбрать фото'; $('foto-del').hidden = true;
  }

  var tajmer = null;
  $('kluch').addEventListener('input', function(){ clearTimeout(tajmer); tajmer = setTimeout(proverit, 600); });
  $('kluch-zabyt').addEventListener('click', function(){
    lsSet(''); $('kluch').value = ''; proverit(); soobshchit('info', 'Ключ удалён с этого устройства');
  });
  $('zag').addEventListener('input', obnovit);
  $('tekst').addEventListener('input', obnovit);
  $('foto').addEventListener('change', function(){
    var f = this.files && this.files[0]; if(!f) return;
    if(fotoUrl) URL.revokeObjectURL(fotoUrl);
    fotoUrl = URL.createObjectURL(f); fotoFile = f;
    $('foto-name').textContent = f.name; $('foto-del').hidden = false; obnovit();
  });
  $('foto-del').addEventListener('click', function(){ sbrosFoto(); obnovit(); });

  $('spisok').addEventListener('click', function(e){
    var b = e.target.closest('button[data-id]'); if(!b || idet) return;
    if(!rabota){ soobshchit('err', 'Чтобы удалить запись, вставьте ключ доступа вверху'); $('kluch').focus(); return; }
    var id = b.dataset.id, p = posts.filter(function(x){ return x.id === id; })[0];
    if(!confirm('Удалить запись «' + (p ? (p.title || p.text.slice(0, 40)) : '') + '»? Вернуть её можно будет только через Викторию')) return;
    idet = true; b.disabled = true; soobshchit('info', 'Удаляю…');
    sohranitSPovtorom(function(ps, blog){
      var ud = ps.filter(function(x){ return x.id === id; })[0];
      if(!ud) throw Object.assign(new Error('Этой записи уже нет'), {status: -1});
      var re = new RegExp('\\n?[ \\t]*<article class="post rise" id="' + esc(id).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '">[\\s\\S]*?</article>');
      var dop = [];
      if(ud.img && /^blog\/img\/[\w.-]+$/.test(ud.img)) dop.push({path: ud.img, mode: '100644', type: 'blob', sha: null});
      return {posts: ps.filter(function(x){ return x.id !== id; }), blog: blog.replace(re, ''), dop: dop};
    }, 'Блог: удалена запись ' + id).then(function(ps){
      idet = false; posts = ps; spisok();
      soobshchit('good', 'Запись удалена. С сайта она пропадёт через пару минут');
    }).catch(function(e){
      idet = false; b.disabled = false;
      soobshchit('err', e.status === -1 ? 'Этой записи уже нет' : ponyatno(e));
    });
  });

  $('forma').addEventListener('submit', function(e){
